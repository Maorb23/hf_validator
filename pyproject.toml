[project]
name = "hf-model-watch"
version = "0.1.0"
description = "Serverless Hugging Face model intake, validation, and comparison pipeline."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "hf-model-watch maintainers" }
]
dependencies = [
  "accelerate>=0.30",
  "huggingface-hub>=0.24",
  "pydantic>=2.7",
  "protobuf>=5",
  "pyyaml>=6.0",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
  "torch>=2.3",
  "transformers>=4.44",
  "typer>=0.12",
  "rich>=13.7",
  "rapidfuzz>=3.0",
  "prefect>=3.7.7",
  "python-dotenv>=1.0",
  "openai>=1.0",
  "boto3>=1.34",
  "datasets>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]
finetune = [
  "bitsandbytes>=0.43; sys_platform == 'linux'",
  "peft>=0.18",
  "trl>=1.8,<2",
  "wandb>=0.18",
]
quality = [
  "sentence-transformers>=3.0",
]

[project.scripts]
hf-watch = "hf_model_watch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
